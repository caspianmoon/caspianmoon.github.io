<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Khazar Ayaz / caspianmoon</title>
  <meta name="description" content="Khazar Ayaz builds KNWN, maintains Memoripy, and publishes software as caspianmoon.">
  <meta name="theme-color" content="#050805">
  <meta property="og:title" content="Khazar Ayaz / caspianmoon">
  <meta property="og:description" content="KNWN, Memoripy, and open-source software by Khazar Ayaz.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://caspianmoon.github.io/">
  <link rel="canonical" href="https://caspianmoon.github.io/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=5">
</head>
<body data-theme="green">
  <div class="scanlines" aria-hidden="true"></div>

  <div class="boot" id="boot" aria-live="polite">
    <pre id="boot-log">CONNECT caspianmoon.github.io:23</pre>
  </div>

  <main class="screen" aria-label="Khazar Ayaz personal terminal">
    <header class="bar">
      <div><strong>moonOS 0.4</strong> <span class="host">/ caspianmoon</span></div>
      <div class="connected">connected</div>
    </header>

    <nav class="menu" id="menu" aria-label="Commands">
      <button type="button" data-command="home">home</button>
      <button type="button" data-command="about">about</button>
      <button type="button" data-command="projects">projects</button>
      <button type="button" data-command="memoripy">memoripy</button>
      <button type="button" data-command="knwn">knwn.app</button>
      <button type="button" data-command="contact">contact</button>
      <a href="https://github.com/caspianmoon" target="_blank" rel="noreferrer">github</a>
    </nav>

    <section class="output" id="output" aria-live="polite">
      <div class="buffer" id="buffer"></div>
    </section>

    <form class="prompt-row" id="terminal-form" autocomplete="off">
      <label class="prompt" for="command">guest@caspianmoon:<span>~$</span></label>
      <input id="command" name="command" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="help">
      <span class="key-hint">← → menu · ↑ ↓ history · enter</span>
    </form>
  </main>

  <script src="/app.js?v=5" defer></script>
</body>
</html>
